[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phi3-pooling"
version = "1.0.0"
description = "Representation pooling components for a Turkish hate speech classification project."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Batuhan Mıh" },
  { name = "Mustafa Kurtulan" },
  { name = "Faruk Topal" },
]
dependencies = [
  "numpy>=1.26,<3",
  "torch>=2.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

